<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Дофамин 60</title>
<style>
:root{--c:#1c1c1e;--ln:#2c2c2e;--mu:#8e8e93;--ac:#5b6bff;--ok:#32d27c;--bad:#ff6a55;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font:16px/1.35 -apple-system,system-ui,"SF Pro Text",Roboto,sans-serif}
#app{max-width:430px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 110px)}
.hd{display:flex;align-items:center;justify-content:center;position:relative;height:48px;margin-bottom:10px}
.hd h1{font-size:22px;margin:0}.av{position:absolute;right:0;width:44px;height:44px;border-radius:50%;background:#1c1c1e;border:2px solid #333;display:grid;place-items:center;font-size:24px}
.seg{display:flex;background:var(--c);border-radius:16px;padding:4px;margin-bottom:14px}
.seg b{flex:1;text-align:center;padding:9px 0;border-radius:12px;font-weight:500;font-size:15px}.seg b.on{background:#636366}
.card{background:var(--c);border:1px solid var(--ln);border-radius:26px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:12px}.row>.card{flex:1}
.ic{width:44px;height:44px;border-radius:50%;background:#1b1f45;display:grid;place-items:center;font-size:20px;flex:none}
.t{display:flex;gap:12px;align-items:center}.t small{color:var(--mu);font-size:14px;display:block}.t strong{font-size:26px}
h2{margin:0 0 4px;font-size:20px}.sub{color:var(--mu);font-size:14px;margin-bottom:12px}
.bar{height:16px;background:#2c2c2e;border-radius:9px;position:relative}.bar i{display:block;height:100%;border-radius:9px;background:var(--ac)}
.bar u{position:absolute;top:-5px;bottom:-5px;width:2px;background:#fff}
.lb{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin-top:6px}
.h{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}.h:first-of-type{border:0}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid #48484a;display:grid;place-items:center;flex:none;font-size:16px}.h.on .ck{background:var(--ac);border-color:var(--ac)}.h.on span{color:var(--mu);text-decoration:line-through}
.mo{display:flex;justify-content:space-between}.mo b{font-size:30px;padding:6px;border-radius:14px;opacity:.45}.mo b.on{opacity:1;background:#2a2f6b}
.hm{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.hm i{aspect-ratio:1;border-radius:6px;background:#2c2c2e}
.tip{padding:12px 0;border-top:1px solid var(--ln)}.tip:first-of-type{border:0}
.pill{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:402px;margin:0 auto;display:flex;background:#1c1c1ecc;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid #3a3a3c;border-radius:40px;padding:6px}
.pill b{flex:1;text-align:center;padding:8px 0;border-radius:32px;font-size:11px;font-weight:600;color:#ddd}.pill b em{display:block;font-style:normal;font-size:22px}.pill b.on{background:#3a3a3ccc;color:var(--ac)}
button{font:inherit;border:0;border-radius:14px;padding:12px;background:#2c2c2e;color:#fff;width:100%}
</style></head><body><div id="app"></div><div class="pill" id="pill"></div>
<script>
const H=["Без шортсов и эдитов","Без сладкого и фастфуда","Соцсети до 20 минут","Тренировка или мяч","Прогулка 30 мин без телефона","Сон до 00:00","Без 18+ контента"];
const TIP=["Убери шортсы с главного экрана и выйди из аккаунта.","Не держи сладкое дома. Купи фрукты и орехи.","Включи лимит: Настройки → Экранное время → Лимиты приложений.","Хотя бы 20 минут с мячом: удар, жонглирование, передачи.","Выйди на 30 минут без телефона. Первые дни скучно, это нормально.","Телефон на зарядку вне кровати за час до сна.","Тяга приходит волной минут на 15. Переключись на любое действие."];
const PH=["Дни 1–14: тяга и скука. Это ломка, она проходит.","Дни 15–35: фокус и сон выравниваются.","Дни 36–60: ровное состояние, скучные дела начинают радовать."];
const day=()=>new Date().toLocaleDateString('sv');
let st;try{st=JSON.parse(localStorage.getItem('dop1'))}catch(e){}
if(!st||!st.start)st={start:day(),d:{}};
const save=()=>{try{localStorage.setItem('dop1',JSON.stringify(st))}catch(e){}};
const cur=()=>Math.min(60,Math.max(1,Math.round((Date.parse(day())-Date.parse(st.start))/864e5)+1));
const rec=d=>st.d[d]||(st.d[d]={h:H.map(()=>0),m:3});
const sc=d=>st.d[d]?st.d[d].h.filter(Boolean).length/H.length:0;
const dl=d=>sc(d)*1.5-.8+((st.d[d]?st.d[d].m:3)-3)*.15;
function lv(){const L=[35];for(let d=1;d<=cur();d++)L.push(Math.max(0,Math.min(100,L[d-1]+dl(d))));return L}
let tab=0,rng=60;
const G=v=>`<div class="bar"><i style="width:${v}%;background:${v>=70?'var(--ok)':'var(--ac)'}"></i><u style="left:70%"></u></div><div class="lb"><span>0</span><span>цель 70</span><span>100</span></div>`;
function today(L,c){const r=rec(c),n=r.h.filter(Boolean).length,v=L[c];
return `<div class="row"><div class="card t"><div class="ic">📅</div><div><small>День</small><strong>${c}/60</strong></div></div><div class="card t"><div class="ic">✅</div><div><small>Сделано</small><strong>${n}/${H.length}</strong></div></div></div>
<div class="card"><h2>Дофамин сейчас: ${v.toFixed(1)}</h2><div class="sub">${v>=70?'Цель достигнута':'Цель: 70. Каждый невыполненный пункт тянет вниз'}</div>${G(v)}</div>
<div class="card"><h2>Сегодня</h2><div class="sub">Отметь, что сделал</div>${H.map((t,i)=>`<div class="h ${r.h[i]?'on':''}" onclick="tg(${i})"><div class="ck">${r.h[i]?'✓':''}</div><span>${t}</span></div>`).join('')}</div>
<div class="card"><h2>Как себя чувствуешь</h2><div class="sub">От тяжело до отлично</div><div class="mo">${['😞','😕','😐','🙂','😄'].map((e,i)=>`<b class="${r.m==i+1?'on':''}" onclick="mo(${i+1})">${e}</b>`).join('')}</div></div>`}
function graph(L,c){const f=Math.max(0,c-rng),p=L.slice(f),W=340,Hh=170,X=i=>8+i*(W-16)/Math.max(1,p.length-1),Y=v=>Hh-8-v*1.54;
const t=L[c]-L[Math.max(0,c-7)],tr=c<2?'Только начало':t>.5?`▲ Растёт: +${t.toFixed(1)} за неделю`:t<-.5?`▼ Падает: ${t.toFixed(1)} за неделю`:'Ровно';
return `<div class="seg">${[[7,'Неделя'],[30,'Месяц'],[60,'60 дней']].map(([k,n])=>`<b class="${rng==k?'on':''}" onclick="rg(${k})">${n}</b>`).join('')}</div>
<div class="card"><h2>${tr}</h2><div class="sub">Старт 35. Цель 70. Сейчас ${L[c].toFixed(1)}</div>
<svg viewBox="0 0 ${W} ${Hh}" width="100%"><line x1="0" x2="${W}" y1="${Y(70)}" y2="${Y(70)}" stroke="#32d27c" stroke-dasharray="4 4"/><text x="${W-4}" y="${Y(70)-5}" fill="#32d27c" font-size="11" text-anchor="end">цель 70</text>
<polyline fill="none" stroke="#5b6bff" stroke-width="3" stroke-linejoin="round" points="${p.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/><circle cx="${X(p.length-1)}" cy="${Y(L[c])}" r="5" fill="#fff"/></svg></div>
<div class="card"><h2>Активность</h2><div class="sub">60 дней: чем ярче, тем больше сделано</div><div class="hm">${Array.from({length:60},(_,i)=>{const d=i+1,s=sc(d),col=d>c?'#2c2c2e':s==0?'#4a2326':s<.4?'#2b2f66':s<.7?'#3a46c4':s<1?'#4a56ee':'#7b88ff';return `<i style="background:${col};${d==c?'outline:2px solid #fff':''}"></i>`}).join('')}</div></div>`}
function lim(){return `<div class="card"><h2>Ограничения на 60 дней</h2><div class="sub">Правила жёсткие, чтобы мозг успел восстановиться</div>
${[['🚫','Шортсы, рилсы, эдиты','0 минут. Полный запрет'],['📵','Соцсети','максимум 20 минут в день'],['🍬','Сладкое и фастфуд','нет. Один свободный приём в неделю по воскресеньям'],['🔞','18+ контент','0. Тяга пройдёт за 10–15 минут'],['🌙','Телефон после 23:00','вне кровати, на зарядке']].map(([i,a,b])=>`<div class="h"><div class="ic">${i}</div><div><b>${a}</b><br><span style="color:var(--mu);font-size:14px">${b}</span></div></div>`).join('')}</div>
<div class="card"><h2>Как включить на iPhone</h2><div class="sub">Настройки → Экранное время → Лимиты приложений. Поставь 20 минут на соцсети и 0 на шортсы-приложения.</div><button onclick="if(confirm('Начать 60 дней заново?')){st={start:day(),d:{}};save();draw()}">Начать заново</button></div>`}
function tips(c){const r=rec(c),o=[];if(r.m<=2)o.push('Тяжело — это нормально. Выйди на 15 минут на улицу без телефона.');
r.h.forEach((v,i)=>{if(!v&&o.length<4)o.push(TIP[i])});
if(!o.length)o.push('Идеальный день. Не гонись за пиками: цель — ровный плюс.');
return `<div class="card"><h2>Советы на сегодня</h2><div class="sub">${PH[c<15?0:c<36?1:2]}</div>${o.map(t=>`<div class="tip">${t}</div>`).join('')}</div>
<div class="card"><h2>Помни</h2><div class="sub">Быстрый дофамин даёт пик и яму. Скучные привычки дают ровный подъём. Пропущенный день тянет уровень вниз, выполненный поднимает.</div></div>`}
function draw(){const L=lv(),c=cur();document.getElementById('app').innerHTML=`<div class="hd"><h1>${['Сегодня','График','Лимиты','Советы'][tab]}</h1><div class="av">🧔</div></div>`+[today,graph,lim,tips][tab](L,c);
document.getElementById('pill').innerHTML=[['🏠','Сегодня'],['📈','График'],['🔒','Лимиты'],['💡','Советы']].map(([e,n],i)=>`<b class="${tab==i?'on':''}" onclick="tb(${i})"><em>${e}</em>${n}</b>`).join('')}
const tg=i=>{const r=rec(cur());r.h[i]=r.h[i]?0:1;save();draw()},mo=n=>{rec(cur()).m=n;save();draw()},tb=i=>{tab=i;draw();scrollTo(0,0)},rg=k=>{rng=k;draw()};
draw();
</script></body></html>
