<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Tracker Pro + Library</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #1c1c1e;
            --accent-orange: #ff7a00;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --danger: #ff453a;
            --success: #30d158;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background-color: var(--bg-color);
            border-radius: 40px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            border: 8px solid #000;
        }

        /* Шапка */
        .header {
            padding: 20px 20px 10px;
            color: var(--text-main);
            margin-top: 20px;
            z-index: 10;
            background: var(--bg-color);
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header-top h1 { font-size: 18px; font-weight: 600; }
        .header-actions { display: flex; gap: 10px; }
        
        .icon-btn {
            background: var(--card-bg);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s;
        }
        .icon-btn:active { transform: scale(0.85); background: #333; }
        .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* Главные вкладки (Коллекция/Библиотека) */
        .main-tabs {
            display: flex;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 10px;
            position: relative;
        }
        .main-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: color 0.3s;
            position: relative;
            z-index: 2;
        }
        .main-tab.active { color: white; }
        .main-tab-indicator {
            position: absolute;
            top: 4px;
            bottom: 4px;
            width: calc(50% - 4px);
            background: var(--accent-orange);
            border-radius: 8px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1;
        }

        /* Внутренние табы (Фильмы/Сериалы) */
        .sub-tabs {
            display: flex;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 4px;
            position: relative;
            margin-bottom: 5px;
        }
        .sub-tab {
            flex: 1;
            text-align: center;
            padding: 6px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: color 0.3s;
            position: relative;
            z-index: 2;
        }
        .sub-tab.active { color: white; }
        .sub-tab-indicator {
            position: absolute;
            top: 4px;
            bottom: 4px;
            width: calc(50% - 4px);
            background: #3a3a3c;
            border-radius: 8px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1;
        }

        /* Поиск */
        .search-bar {
            padding: 0 20px 10px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }
        .search-bar.active { display: block; }
        .search-bar input {
            width: 100%;
            background: var(--card-bg);
            border: none;
            padding: 12px 15px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Контент */
        .content {
            flex: 1;
            padding: 10px 20px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* Список */
        .movie-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 100px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            position: relative;
            transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
            animation: cardAppear 0.4s ease-out backwards;
            will-change: transform;
            cursor: pointer;
        }
        .movie-card.dragging {
            opacity: 0.9;
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
            cursor: grabbing;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .place-badge {
            position: absolute;
            top: -5px;
            left: -5px;
            background: var(--accent-orange);
            color: white;
            font-size: 12px;
            font-weight: bold;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            border: 2px solid var(--bg-color);
            z-index: 2;
        }

        .movie-poster {
            width: 50px;
            height: 70px;
            background: #333;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .movie-info { flex: 1; overflow: hidden; }
        .movie-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-rating { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        
        .rating-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #2c2c2e;
            padding: 2px 6px;
            border-radius: 8px;
        }
        .rating-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 2px;
            transition: color 0.2s, transform 0.1s;
        }
        .rating-btn:active { transform: scale(0.8); color: var(--accent-orange); }
        .rating-btn svg { width: 12px; height: 12px; fill: currentColor; }
        .rating-value { font-size: 14px; font-weight: bold; color: var(--accent-orange); min-width: 16px; text-align: center; }
        .rating-value.pulse { animation: pulse 0.3s; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Кнопка "Хочу посмотреть" в библиотеке */
        .wishlist-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.2s;
        }
        .wishlist-btn.active { color: var(--accent-orange); }
        .wishlist-btn:active { transform: scale(0.8); }
        .wishlist-btn svg { width: 22px; height: 22px; fill: currentColor; }

        /* Меню карточки */
        .options-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .options-btn:hover { color: white; }
        .options-btn svg { width: 20px; height: 20px; fill: currentColor; }

        .context-menu {
            position: absolute;
            right: 10px;
            top: 50px;
            background: #2c2c2e;
            border-radius: 12px;
            padding: 5px;
            display: none;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 20;
            min-width: 150px;
            transform-origin: top right;
            animation: menuAppear 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .context-menu.active { display: flex; }
        @keyframes menuAppear {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .context-menu button {
            background: none;
            border: none;
            color: white;
            padding: 10px 15px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }
        .context-menu button:hover { background: #3a3a3c; }
        .context-menu button.delete { color: var(--danger); }
        .context-menu button svg { width: 16px; height: 16px; fill: currentColor; }

        /* Нижняя панель */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            background: linear-gradient(to top, var(--bg-color) 60%, transparent);
            pointer-events: none;
        }
        .add-btn {
            background: var(--accent-orange);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 122, 0, 0.5);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
            pointer-events: auto;
            margin-bottom: 10px;
        }
        .add-btn:active { transform: scale(0.9); box-shadow: 0 2px 10px rgba(255, 122, 0, 0.5); }
        .add-btn svg { width: 28px; height: 28px; fill: white; }

        /* Модальные окна */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            border-radius: 40px;
            z-index: 100;
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-form {
            background: var(--card-bg);
            width: 100%;
            max-height: 90%;
            overflow-y: auto;
            border-radius: 30px 30px 0 0;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: absolute;
            bottom: 0;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-form { transform: translateY(0); }

        .modal-form h2 { color: white; font-size: 20px; margin-bottom: 5px; }
        
        .input-row { display: flex; gap: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; }
        .input-group label { color: var(--text-muted); font-size: 12px; }
        
        .input-group input[type="text"], 
        .input-group input[type="number"], 
        .input-group select {
            background: #2c2c2e;
            border: 1px solid transparent;
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            width: 100%;
            transition: border 0.3s;
        }
        .input-group input:focus { border: 1px solid var(--accent-orange); }

        .file-input-wrapper {
            background: #2c2c2e;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px dashed #555;
            transition: border 0.3s, background 0.3s;
        }
        .file-input-wrapper:hover { background: #333; border-color: var(--accent-orange); }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .file-preview {
            width: 60px; height: 80px; border-radius: 8px; object-fit: cover; margin: 0 auto 5px; display: none;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .save-btn {
            background: var(--accent-orange);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, background 0.2s;
        }
        .save-btn:active { transform: scale(0.97); background: #e06c00; }
        .cancel-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .cancel-btn:hover { color: white; }

        /* Визитка */
        .detail-card {
            background: #1c1c1e;
            width: 85%;
            border-radius: 30px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transform: scale(0.8);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal-overlay.active .detail-card { transform: scale(1); opacity: 1; }

        .detail-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .detail-close:hover { background: rgba(255,255,255,0.2); }
        .detail-close svg { width: 16px; height: 16px; fill: currentColor; }

        .detail-poster {
            width: 140px;
            height: 200px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #333;
        }

        .detail-title {
            color: white;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
        }

        .detail-type {
            color: var(--accent-orange);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .detail-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            width: 100%;
            justify-content: center;
        }

        .stat-box {
            background: #2c2c2e;
            padding: 10px 20px;
            border-radius: 15px;
            text-align: center;
            min-width: 80px;
        }
        .stat-label { color: var(--text-muted); font-size: 11px; margin-bottom: 4px; text-transform: uppercase; }
        .stat-value { color: white; font-size: 18px; font-weight: bold; }
        .stat-value.orange { color: var(--accent-orange); }

        .detail-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .detail-actions-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .detail-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s, opacity 0.2s;
        }
        .detail-actions button:active { transform: scale(0.95); }
        .btn-edit { background: #3a3a3c; color: white; }
        .btn-delete { background: rgba(255, 69, 58, 0.2); color: var(--danger); }
        .btn-add-to-collection { background: var(--accent-orange); color: white; }
        .detail-actions svg { width: 16px; height: 16px; fill: currentColor; }

        /* Фильтры библиотеки */
        .library-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            padding: 0 20px;
        }
        .filter-btn {
            background: var(--card-bg);
            border: 1px solid #333;
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--accent-orange);
            color: white;
            border-color: var(--accent-orange);
        }

        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body>

<div class="phone-frame">
    <div class="header">
        <div class="header-top">
            <h1 id="pageTitle">Моя коллекция <span id="countDisplay" style="color: var(--text-muted); font-size: 14px; font-weight: normal;"></span></h1>
            <div class="header-actions">
                <button class="icon-btn" id="searchToggle" title="Поиск">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>
            </div>
        </div>
        
        <div class="search-bar" id="searchBar">
            <input type="text" id="searchInput" placeholder="Поиск по названию...">
        </div>

        <!-- Главные вкладки -->
        <div class="main-tabs">
            <div class="main-tab-indicator" id="mainTabIndicator"></div>
            <div class="main-tab active" onclick="switchMainTab('collection', this)">Коллекция</div>
            <div class="main-tab" onclick="switchMainTab('library', this)">Библиотека</div>
        </div>

        <!-- Внутренние вкладки -->
        <div class="sub-tabs" id="subTabs">
            <div class="sub-tab-indicator" id="subTabIndicator"></div>
            <div class="sub-tab active" data-type="Фильм" onclick="switchSubTab('Фильм', this)">Фильмы</div>
            <div class="sub-tab" data-type="Сериал" onclick="switchSubTab('Сериал', this)">Сериалы</div>
        </div>
    </div>

    <!-- Фильтры для библиотеки -->
    <div class="library-filters" id="libraryFilters" style="display: none;">
        <button class="filter-btn active" id="filterAll" onclick="setLibraryFilter('all')">Все</button>
        <button class="filter-btn" id="filterWishlist" onclick="setLibraryFilter('wishlist')">Хочу посмотреть</button>
    </div>

    <div class="content">
        <div class="movie-list" id="movieList"></div>
    </div>

    <div class="bottom-nav">
        <button class="add-btn" id="openModalBtn">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
    </div>

    <!-- Модальное окно: Форма -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-form">
            <h2 id="modalTitle">Добавить</h2>
            
            <div class="input-group">
                <label>Название</label>
                <input type="text" id="inputTitle" placeholder="Название фильма/сериала">
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label>Тип</label>
                    <select id="inputType">
                        <option value="Фильм">Фильм</option>
                        <option value="Сериал">Сериал</option>
                    </select>
                </div>
            </div>

            <div class="input-row" id="collectionFields">
                <div class="input-group">
                    <label>Место (1-10)</label>
                    <input type="number" id="inputPlace" min="1" max="10" value="1">
                </div>
                <div class="input-group">
                    <label>Рейтинг (1-10)</label>
                    <input type="number" id="inputRating" min="1" max="10" value="5">
                </div>
            </div>

            <div class="input-group">
                <label>Постер</label>
                <div class="file-input-wrapper">
                    <img id="filePreview" class="file-preview" src="">
                    <span id="fileText">Нажмите, чтобы выбрать фото</span>
                    <input type="file" id="inputFile" accept="image/*">
                </div>
            </div>

            <!-- Чекбокс "Хочу посмотреть" только для библиотеки -->
            <div class="input-group" id="wishlistCheckboxGroup" style="display: none; flex-direction: row; align-items: center; gap: 10px; margin-top: 5px;">
                <input type="checkbox" id="inputWishlist" checked style="width: 20px; height: 20px; accent-color: var(--accent-orange);">
                <label for="inputWishlist" style="color: white; font-size: 14px; cursor: pointer;">Хочу посмотреть</label>
            </div>

            <button class="save-btn" id="saveBtn">Сохранить</button>
            <button class="cancel-btn" id="closeBtn">Отмена</button>
        </div>
    </div>

    <!-- Модальное окно: Визитка -->
    <div class="modal-overlay" id="detailOverlay">
        <div class="detail-card">
            <button class="detail-close" onclick="closeDetail()">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            <img id="detailPoster" class="detail-poster" src="" alt="poster">
            <div class="detail-title" id="detailTitle">Название</div>
            <div class="detail-type" id="detailType">Тип</div>
            
            <div class="detail-stats" id="detailStats">
                <div class="stat-box">
                    <div class="stat-label">Место</div>
                    <div class="stat-value orange" id="detailPlace">1</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Рейтинг</div>
                    <div class="stat-value" id="detailRating">5</div>
                </div>
            </div>

            <div class="detail-actions">
                <!-- Кнопка "В коллекцию" (только для библиотеки) -->
                <button class="btn-add-to-collection" id="detailAddToCollection" style="display: none;">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    Добавить в коллекцию
                </button>
                <div class="detail-actions-row">
                    <button class="btn-edit" id="detailEditBtn">
                        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                        Изменить
                    </button>
                    <button class="btn-delete" id="detailDeleteBtn">
                        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        Удалить
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Данные коллекции (с местами и рейтингами)
    let collection = [
        { id: 1, title: "Дюна: Часть вторая", type: "Фильм", rating: 9, place: 1, poster: "" },
        { id: 2, title: "Оппенгеймер", type: "Фильм", rating: 8, place: 2, poster: "" },
        { id: 3, title: "Рик и Морти", type: "Сериал", rating: 10, place: 1, poster: "" }
    ];

    // Данные библиотеки (просто список + флаг "Хочу посмотреть")
    let library = [
        { id: 101, title: "Дюна: Мессия", type: "Фильм", wishlist: true, poster: "" },
        { id: 102, title: "Медленные лошади", type: "Сериал", wishlist: true, poster: "" },
        { id: 103, title: "Головоломка 2", type: "Фильм", wishlist: false, poster: "" }
    ];

    // Состояние
    let currentMainTab = 'collection'; // 'collection' | 'library'
    let currentSubTab = 'Фильм'; // 'Фильм' | 'Сериал'
    let currentLibraryFilter = 'all'; // 'all' | 'wishlist'
    let editingId = null; // ID редактируемого элемента
    let editingMode = null; // 'collection' | 'library'
    let base64Image = null;
    let searchQuery = "";
    let detailItemId = null;
    let detailMode = null;

    // DOM
    const movieList = document.getElementById('movieList');
    const modalOverlay = document.getElementById('modalOverlay');
    const detailOverlay = document.getElementById('detailOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeBtn = document.getElementById('closeBtn');
    const saveBtn = document.getElementById('saveBtn');
    const mainTabIndicator = document.getElementById('mainTabIndicator');
    const subTabIndicator = document.getElementById('subTabIndicator');
    const countDisplay = document.getElementById('countDisplay');
    const pageTitle = document.getElementById('pageTitle');
    const searchToggle = document.getElementById('searchToggle');
    const searchBar = document.getElementById('searchBar');
    const searchInput = document.getElementById('searchInput');
    const libraryFilters = document.getElementById('libraryFilters');
    const filterAll = document.getElementById('filterAll');
    const filterWishlist = document.getElementById('filterWishlist');
    
    // Inputs формы
    const inputTitle = document.getElementById('inputTitle');
    const inputType = document.getElementById('inputType');
    const inputPlace = document.getElementById('inputPlace');
    const inputRating = document.getElementById('inputRating');
    const inputFile = document.getElementById('inputFile');
    const filePreview = document.getElementById('filePreview');
    const fileText = document.getElementById('fileText');
    const modalTitle = document.getElementById('modalTitle');
    const collectionFields = document.getElementById('collectionFields');
    const wishlistCheckboxGroup = document.getElementById('wishlistCheckboxGroup');
    const inputWishlist = document.getElementById('inputWishlist');

    // Детали
    const detailPoster = document.getElementById('detailPoster');
    const detailTitle = document.getElementById('detailTitle');
    const detailType = document.getElementById('detailType');
    const detailPlace = document.getElementById('detailPlace');
    const detailRating = document.getElementById('detailRating');
    const detailStats = document.getElementById('detailStats');
    const detailEditBtn = document.getElementById('detailEditBtn');
    const detailDeleteBtn = document.getElementById('detailDeleteBtn');
    const detailAddToCollection = document.getElementById('detailAddToCollection');

    // ========== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ==========
    function switchMainTab(tab, el) {
        currentMainTab = tab;
        document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        
        if (tab === 'library') {
            mainTabIndicator.style.transform = 'translateX(100%)';
            pageTitle.innerHTML = 'Библиотека <span id="countDisplay" style="color: var(--text-muted); font-size: 14px; font-weight: normal;"></span>';
            libraryFilters.style.display = 'flex';
        } else {
            mainTabIndicator.style.transform = 'translateX(0)';
            pageTitle.innerHTML = 'Моя коллекция <span id="countDisplay" style="color: var(--text-muted); font-size: 14px; font-weight: normal;"></span>';
            libraryFilters.style.display = 'none';
        }
        
        searchQuery = "";
        searchInput.value = "";
        render();
    }

    function switchSubTab(type, el) {
        currentSubTab = type;
        document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        
        if (type === 'Сериал') {
            subTabIndicator.style.transform = 'translateX(100%)';
        } else {
            subTabIndicator.style.transform = 'translateX(0)';
        }
        
        render();
    }

    function setLibraryFilter(filter) {
        currentLibraryFilter = filter;
        filterAll.classList.toggle('active', filter === 'all');
        filterWishlist.classList.toggle('active', filter === 'wishlist');
        render();
    }

    // ========== ПОИСК ==========
    searchToggle.addEventListener('click', () => {
        searchBar.classList.toggle('active');
        if (searchBar.classList.contains('active')) {
            searchInput.focus();
        } else {
            searchQuery = "";
            searchInput.value = "";
            render();
        }
    });

    searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase();
        render();
    });

    // ========== РЕНДЕР ==========
    function render() {
        movieList.innerHTML = '';
        
        let items = [];
        
        if (currentMainTab === 'collection') {
            items = collection
                .filter(m => m.type === currentSubTab)
                .filter(m => m.title.toLowerCase().includes(searchQuery))
                .sort((a, b) => a.place - b.place);
        } else {
            items = library
                .filter(m => m.type === currentSubTab)
                .filter(m => m.title.toLowerCase().includes(searchQuery));
                
            if (currentLibraryFilter === 'wishlist') {
                items = items.filter(m => m.wishlist);
            }
        }

        // Обновляем счетчик
        const countEl = document.getElementById('countDisplay');
        if (countEl) countEl.textContent = `(${items.length})`;

        if (items.length === 0) {
            movieList.innerHTML = `<div style="color: var(--text-muted); text-align: center; margin-top: 50px; font-size: 14px;">Ничего не найдено</div>`;
            return;
        }

        items.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.dataset.id = item.id;
            card.dataset.mode = currentMainTab;
            if (currentMainTab === 'collection') card.draggable = true;
            card.style.animationDelay = `${index * 0.05}s`;

            const posterUrl = item.poster ? item.poster : 'https://via.placeholder.com/50x70/333/fff?text=' + (item.title[0] || '?');

            // Внутренняя часть карточки
            let innerHTML = '';
            
            if (currentMainTab === 'collection') {
                innerHTML = `
                    <div class="place-badge">${item.place}</div>
                    <img src="${posterUrl}" alt="poster" class="movie-poster">
                    <div class="movie-info">
                        <div class="movie-title">${item.title}</div>
                        <div class="movie-rating">
                            Рейтинг: 
                            <div class="rating-control">
                                <button class="rating-btn" onclick="changeRating(event, ${item.id}, -1)">
                                    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
                                </button>
                                <span class="rating-value" id="rating-${item.id}">${item.rating}</span>
                                <button class="rating-btn" onclick="changeRating(event, ${item.id}, 1)">
                                    <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6 1.41 1.41z"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                // Библиотека
                innerHTML = `
                    <img src="${posterUrl}" alt="poster" class="movie-poster">
                    <div class="movie-info">
                        <div class="movie-title">${item.title}</div>
                        <div class="movie-rating" style="color: var(--text-muted); font-size: 12px;">${item.type}</div>
                    </div>
                    <button class="wishlist-btn ${item.wishlist ? 'active' : ''}" onclick="toggleWishlist(event, ${item.id})">
                        <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                    </button>
                `;
            }

            // Кнопка меню (для обоих режимов)
            innerHTML += `
                <button class="options-btn" onclick="toggleMenu(event, ${item.id}, '${currentMainTab}')">
                    <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                </button>
                <div class="context-menu" id="menu-${item.id}">
                    <button onclick="editItem(${item.id}, '${currentMainTab}')">
                        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                        Редактировать
                    </button>
                    <button class="delete" onclick="deleteItem(${item.id}, '${currentMainTab}')">
                        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        Удалить
                    </button>
                </div>
            `;

            card.innerHTML = innerHTML;

            // Клик по карточке - открыть визитку
            card.addEventListener('click', (e) => {
                if (e.target.closest('.options-btn') || e.target.closest('.rating-btn') || e.target.closest('.context-menu') || e.target.closest('.wishlist-btn')) {
                    return;
                }
                openDetail(item.id, currentMainTab);
            });

            // Drag & Drop только для коллекции
            if (currentMainTab === 'collection') {
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragend', handleDragEnd);
            }

            movieList.appendChild(card);
        });
    }

    // ========== DRAG & DROP ==========
    let draggedItem = null;

    function handleDragStart(e) {
        draggedItem = this;
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => this.style.opacity = '0.9', 0);
    }

    function handleDragOver(e) {
        e.preventDefault();
        const afterElement = getDragAfterElement(movieList, e.clientY);
        const draggable = document.querySelector('.dragging');
        if (afterElement == null) {
            movieList.appendChild(draggable);
        } else {
            movieList.insertBefore(draggable, afterElement);
        }
    }

    function handleDrop(e) {
        e.preventDefault();
        const cards = [...movieList.querySelectorAll('.movie-card')];
        cards.forEach((card, index) => {
            const id = Number(card.dataset.id);
            const movie = collection.find(m => m.id === id);
            if (movie) {
                movie.place = index + 1;
                card.querySelector('.place-badge').textContent = index + 1;
            }
        });
        render();
    }

    function handleDragEnd() {
        this.classList.remove('dragging');
        draggedItem = null;
    }

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.movie-card:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // ========== РЕЙТИНГ ==========
    window.changeRating = (event, id, delta) => {
        event.stopPropagation();
        const movie = collection.find(m => m.id === id);
        if (movie) {
            movie.rating = Math.max(1, Math.min(10, movie.rating + delta));
            const el = document.getElementById(`rating-${id}`);
            if (el) {
                el.textContent = movie.rating;
                el.classList.remove('pulse');
                void el.offsetWidth;
                el.classList.add('pulse');
            }
        }
    };

    // ========== WISHLIST ==========
    window.toggleWishlist = (event, id) => {
        event.stopPropagation();
        const item = library.find(m => m.id === id);
        if (item) {
            item.wishlist = !item.wishlist;
            render();
        }
    };

    // ========== МЕНЮ ==========
    window.toggleMenu = (event, id, mode) => {
        event.stopPropagation();
        document.querySelectorAll('.context-menu').forEach(menu => {
            if (menu.id !== `menu-${id}`) menu.classList.remove('active');
        });
        const menu = document.getElementById(`menu-${id}`);
        menu.classList.toggle('active');
    };

    document.addEventListener('click', () => {
        document.querySelectorAll('.context-menu').forEach(menu => menu.classList.remove('active'));
    });

    // ========== ВИЗИТКА ==========
    window.openDetail = (id, mode) => {
        const item = mode === 'collection' ? collection.find(m => m.id === id) : library.find(m => m.id === id);
        if (!item) return;

        detailItemId = id;
        detailMode = mode;

        const posterUrl = item.poster ? item.poster : 'https://via.placeholder.com/140x200/333/fff?text=' + (item.title[0] || '?');
        
        detailPoster.src = posterUrl;
        detailTitle.textContent = item.title;
        detailType.textContent = item.type;

        if (mode === 'collection') {
            detailStats.style.display = 'flex';
            detailPlace.textContent = item.place;
            detailRating.textContent = item.rating;
            detailAddToCollection.style.display = 'none';
        } else {
            // В библиотеке скрываем статистику, показываем кнопку "В коллекцию"
            detailStats.style.display = 'none';
            detailAddToCollection.style.display = 'flex';
        }

        detailOverlay.classList.add('active');
    };

    window.closeDetail = () => {
        detailOverlay.classList.remove('active');
        setTimeout(() => { detailItemId = null; detailMode = null; }, 300);
    };

    detailOverlay.addEventListener('click', (e) => {
        if (e.target === detailOverlay) closeDetail();
    });

    // Кнопки в визитке
    detailEditBtn.addEventListener('click', () => {
        if (detailItemId) {
            const id = detailItemId;
            const mode = detailMode;
            closeDetail();
            setTimeout(() => editItem(id, mode), 300);
        }
    });

    detailDeleteBtn.addEventListener('click', () => {
        if (detailItemId) {
            const id = detailItemId;
            const mode = detailMode;
            closeDetail();
            setTimeout(() => deleteItem(id, mode), 300);
        }
    });

    detailAddToCollection.addEventListener('click', () => {
        if (detailItemId) {
            const item = library.find(m => m.id === detailItemId);
            if (item) {
                closeDetail();
                setTimeout(() => {
                    // Открываем форму добавления в коллекцию с заполненными данными
                    openFormForCollection(item);
                }, 300);
            }
        }
    });

    // ========== ФОРМА ==========
    function openFormForCollection(sourceItem) {
        editingId = null;
        editingMode = 'collection';
        modalTitle.textContent = "Добавить в коллекцию";
        inputTitle.value = sourceItem.title;
        inputType.value = sourceItem.type;
        inputPlace.value = collection.filter(m => m.type === sourceItem.type).length + 1;
        inputRating.value = 5;
        
        base64Image = sourceItem.poster;
        if (sourceItem.poster) {
            filePreview.src = sourceItem.poster;
            filePreview.style.display = 'block';
            fileText.style.display = 'none';
        } else {
            filePreview.style.display = 'none';
            fileText.style.display = 'block';
            fileText.textContent = "Нажмите, чтобы выбрать фото";
        }
        inputFile.value = '';

        // Показываем поля коллекции, скрываем чекбокс
        collectionFields.style.display = 'flex';
        wishlistCheckboxGroup.style.display = 'none';

        modalOverlay.classList.add('active');
    }

    openModalBtn.addEventListener('click', () => {
        editingId = null;
        editingMode = currentMainTab;
        
        if (currentMainTab === 'collection') {
            modalTitle.textContent = "Добавить в коллекцию";
            collectionFields.style.display = 'flex';
            wishlistCheckboxGroup.style.display = 'none';
            inputPlace.value = collection.filter(m => m.type === currentSubTab).length + 1;
            inputRating.value = 5;
        } else {
            modalTitle.textContent = "Добавить в библиотеку";
            collectionFields.style.display = 'none';
            wishlistCheckboxGroup.style.display = 'flex';
            inputWishlist.checked = true;
        }

        inputTitle.value = '';
        inputType.value = currentSubTab;
        base64Image = null;
        inputFile.value = '';
        filePreview.style.display = 'none';
        fileText.style.display = 'block';
        fileText.textContent = "Нажмите, чтобы выбрать фото";

        modalOverlay.classList.add('active');
    });

    closeBtn.addEventListener('click', () => {
        modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });

    // Загрузка файла
    inputFile.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                base64Image = event.target.result;
                filePreview.src = base64Image;
                filePreview.style.display = 'block';
                fileText.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    });

    // Сохранение
    saveBtn.addEventListener('click', () => {
        const title = inputTitle.value.trim();
        const type = inputType.value;

        if (!title) return alert('Введите название!');

        if (editingMode === 'collection') {
            let place = parseInt(inputPlace.value);
            let rating = parseInt(inputRating.value);
            if (isNaN(place) || place < 1) place = 1;
            if (isNaN(rating) || rating < 1) rating = 1;
            if (rating > 10) rating = 10;
            if (place > 10) place = 10;

            if (editingId) {
                const index = collection.findIndex(m => m.id === editingId);
                if (index !== -1) {
                    collection[index] = {
                        ...collection[index],
                        title, type, place, rating,
                        poster: base64Image ? base64Image : collection[index].poster
                    };
                }
            } else {
                collection.push({
                    id: Date.now(),
                    title, type, place, rating,
                    poster: base64Image || ""
                });
            }
        } else {
            // Библиотека
            const wishlist = inputWishlist.checked;
            
            if (editingId) {
                const index = library.findIndex(m => m.id === editingId);
                if (index !== -1) {
                    library[index] = {
                        ...library[index],
                        title, type, wishlist,
                        poster: base64Image ? base64Image : library[index].poster
                    };
                }
            } else {
                library.push({
                    id: Date.now(),
                    title, type, wishlist,
                    poster: base64Image || ""
                });
            }
        }

        modalOverlay.classList.remove('active');
        
        // Если тип не совпадает с текущим табом, переключаем
        if (type !== currentSubTab) {
            const targetTab = document.querySelector(`.sub-tab[data-type="${type}"]`);
            switchSubTab(type, targetTab);
        } else {
            render();
        }
    });

    // Редактирование
    window.editItem = (id, mode) => {
        editingId = id;
        editingMode = mode;

        if (mode === 'collection') {
            const movie = collection.find(m => m.id === id);
            if (!movie) return;
            modalTitle.textContent = "Редактировать (Коллекция)";
            inputTitle.value = movie.title;
            inputType.value = movie.type;
            inputPlace.value = movie.place;
            inputRating.value = movie.rating;
            collectionFields.style.display = 'flex';
            wishlistCheckboxGroup.style.display = 'none';
            
            base64Image = movie.poster;
            if (movie.poster) {
                filePreview.src = movie.poster;
                filePreview.style.display = 'block';
                fileText.style.display = 'none';
            } else {
                filePreview.style.display = 'none';
                fileText.style.display = 'block';
                fileText.textContent = "Нажмите, чтобы выбрать фото";
            }
        } else {
            const item = library.find(m => m.id === id);
            if (!item) return;
            modalTitle.textContent = "Редактировать (Библиотека)";
            inputTitle.value = item.title;
            inputType.value = item.type;
            inputWishlist.checked = item.wishlist;
            collectionFields.style.display = 'none';
            wishlistCheckboxGroup.style.display = 'flex';
            
            base64Image = item.poster;
            if (item.poster) {
                filePreview.src = item.poster;
                filePreview.style.display = 'block';
                fileText.style.display = 'none';
            } else {
                filePreview.style.display = 'none';
                fileText.style.display = 'block';
                fileText.textContent = "Нажмите, чтобы выбрать фото";
            }
        }

        inputFile.value = '';
        document.querySelectorAll('.context-menu').forEach(m => m.classList.remove('active'));
        modalOverlay.classList.add('active');
    };

    // Удаление
    window.deleteItem = (id, mode) => {
        if (confirm("Удалить этот элемент?")) {
            const card = document.querySelector(`.movie-card[data-id="${id}"]`);
            if (card) {
                card.style.transform = 'translateX(-100%)';
                card.style.opacity = '0';
                setTimeout(() => {
                    if (mode === 'collection') {
                        collection = collection.filter(m => m.id !== id);
                    } else {
                        library = library.filter(m => m.id !== id);
                    }
                    render();
                }, 300);
            } else {
                if (mode === 'collection') {
                    collection = collection.filter(m => m.id !== id);
                } else {
                    library = library.filter(m => m.id !== id);
                }
                render();
            }
        }
    };

    // Инициализация
    render();
</script>
